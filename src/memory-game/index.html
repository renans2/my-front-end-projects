<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <title>Memory Game</title>
</head>
<body>
    <div class="container">
        <div class="menu">
            <span class="message">Find all the pairs to finish the game</span>
            <div class="select-container">
                <label for="select">Choose difficulty:</label>
                <select name="Choose difficulty level" id="select">
                    <option value="4">Easy (4x4)</option>
                    <option value="6">Hard (6x6)</option>
                    <option value="8">ETERNAL (8x8)</option>
                </select>
                <button id="start-button">Start</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

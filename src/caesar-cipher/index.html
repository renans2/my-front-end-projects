<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <title>Caesar Cipher</title>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Caesar Cipher</h1>
            <code>The encrypt/decrypt process only affect alphabet characters, all other characters will remain unchanged.</code>
        </header>

        <div id="options">
            <div class="type">
                <label for="type-select">Type:</label>
                <select id="type-select">
                    <option value="encrypt">encrypt</option>
                    <option value="decrypt">decrypt</option>
                </select>
            </div>

            <div class="shift-amount">
                <label for="shift-amount-select">Shift amount: </label>
                <select id="shift-amount-select"></select>
            </div>

            <button id="cipher-button">Encrypt</button>
        </div>

        <div class="textarea-container">
            <label for="input">Text to be encrypted:</label>
            <textarea id="input" placeholder="Place your input text here"></textarea>
        </div>

        <div class="textarea-container">
            <label for="output">Encrypted text:</label>
            <textarea id="output" placeholder="The resulting text will show up here" disabled></textarea>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
